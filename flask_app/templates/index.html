<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predictor de Diabetes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="container">
    <header>
      <span class="icon">🩺</span>
      <h1>Predictor de <span>Diabetes</span></h1>
      <p class="subtitle">Introduce tus datos clínicos y el modelo de Machine Learning estimará tu riesgo.</p>
    </header>

    {% if error %}
      <div class="error">⚠️ {{ error }}</div>
    {% endif %}

    <form action="/predict" method="POST">
      <div class="grid">
        {% for feature in features %}
        <div class="field">
          <label for="{{ feature }}">{{ labels[feature] }}</label>
          <input
            type="number"
            id="{{ feature }}"
            name="{{ feature }}"
            step="{{ steps[feature] }}"
            value="{{ defaults[feature] }}"
            min="0"
            required
          />
        </div>
        {% endfor %}
      </div>

      <button type="submit">Analizar riesgo &rarr;</button>
    </form>

    <p class="disclaimer">
      Este predictor es solo orientativo y no sustituye el diagnóstico médico profesional.
    </p>
  </div>
</body>
</html>
